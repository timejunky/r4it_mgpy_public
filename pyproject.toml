[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manifestguard"
version = "1.6.46.post6"
description = "Free ManifestGuard. Validates local manifests and does not include Pro commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "packaging>=23.0",
    "tomli>=2.0.1; python_version<'3.11'"
]
license = { text = "Proprietary" }
authors = [
    { name = "Nejat Philip Eryigit", email = "info@ready-4-it.com" }
]
maintainers = [
    { name = "Nejat Philip Eryigit", email = "info@ready-4-it.com" }
]
keywords = ["manifestguard", "free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.urls]
Homepage = "https://www.ready-4-it.com/mgpy"
Repository = "https://github.com/timejunky/r4it_mgpy_public"

[project.scripts]
manifestguard = "manifestguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
